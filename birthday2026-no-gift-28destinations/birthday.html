<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4f8">
<title>Happy Birthday なるみ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="birthday-page">
<div id="birthdayConfetti" class="celebration" aria-hidden="true"></div>

<main class="screen birthday-screen">
  <p class="date-title">2026.09.22</p>
  <div class="cake">🎂</div>
  <p class="happy">HAPPY BIRTHDAY!</p>
  <h1>Dear なるみ</h1>

  <section class="message-card">
    <p>
      お誕生日おめでとう！<br><br>
      今年も素敵な一年になりますように。<br>
      これからもたくさん一緒に<br>
      楽しい思い出を作っていこうね。
    </p>
  </section>

  <section class="trip-message-card">
    <span>✈️ BIRTHDAY TRIP</span>
    <h2 id="birthdayDestination">旅行先</h2>
    <p>ここから始まる2日間、楽しもう！</p>
  </section>

  <button class="main-button" onclick="location.href='schedule.html'">
    ✈️ 旅行の日程を見る
  </button>
</main>
<script src="js/config.js"></script>
<script>document.getElementById("birthdayDestination").textContent = TRIP_DESTINATION;</script>
<script src="js/birthday.js"></script>
</body>
</html>
