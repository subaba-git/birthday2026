<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4f8">
<title>旅行の日程</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="screen schedule-screen">
  <p class="step">TRIP SCHEDULE</p>
  <h1>✈️ 旅行の日程</h1>

  <section class="trip-card">
    <span>今回の旅行先</span>
    <strong id="scheduleDestination">旅行先</strong>
  </section>

  <section class="schedule-card">
    <article class="schedule-row">
      <span class="schedule-day">DAY 1</span>
      <div>
        <h2>9月22日</h2>
        <p>出発 → <span class="scheduleDestinationText">旅行先</span>へ</p>
      </div>
    </article>
    <article class="schedule-row">
      <span class="schedule-day">DAY 2</span>
      <div>
        <h2>9月23日</h2>
        <p><span class="scheduleDestinationText">旅行先</span>を楽しむ → 帰宅</p>
      </div>
    </article>
  </section>

  <p class="footer-note">楽しい2日間にしよう！</p>
</main>
<script src="js/config.js"></script>
<script>
const d = TRIP_DESTINATION;
document.getElementById("scheduleDestination").textContent = d;
document.querySelectorAll(".scheduleDestinationText").forEach(el => el.textContent = d);
</script>
</body>
</html>
