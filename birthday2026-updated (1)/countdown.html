<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4f8">
<title>誕生日までのカウントダウン</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="countdown-page">
<div id="celebration" class="celebration" aria-hidden="true"></div>

<main class="screen countdown-screen">
  <p class="step">STEP 2</p>
  <p class="small-heading">BIRTHDAY COUNTDOWN</p>
  <h1>特別な日まで</h1>

  <section class="trip-card">
    <span id="destinationLabel">✈️ アキネーターの最後の結果</span>
    <strong id="destinationName">旅行先</strong>
    <p id="diagnosisStatus" class="diagnosis-status"></p>
  </section>

  <section class="count-card">
    <p>2026年9月22日まで</p>
    <div id="countdown" class="count-value">--:--:--:--</div>
    <div class="count-units">
      <span>日</span><span>時間</span><span>分</span><span>秒</span>
    </div>
  </section>

  <div id="birthdayNotice" class="birthday-notice is-hidden">
    <div class="big-emoji">🎉</div>
    <h2>今日は誕生日！</h2>
    <p>お誕生日おめでとう！<br>いよいよ特別な2日間のスタート。</p>
    <button class="main-button" onclick="location.href='birthday.html'">
      🎂 お祝いページを見る
    </button>
  </div>

  <p class="footer-note">大切な日まで、もう少し。</p>
</main>
<script src="js/config.js"></script>
<script src="js/countdown.js"></script>
</body>
</html>
