<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ff8fab">
  <title>Trip Akinator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="screen">
    <section class="birthday-card travel-card">
      <p class="eyebrow">SEPTEMBER 22–23</p>
      <h1 class="section-title">✈️ 旅行先を<br>決めよう！</h1>

      <div class="progress">
        <div id="progressBar"></div>
      </div>

      <p id="questionNumber" class="question-number">QUESTION 1</p>
      <h2 id="question" class="question">質問</h2>

      <div id="answers" class="answers"></div>

      <div id="thinking" class="thinking hidden">
        <div class="spinner"></div>
        <p>あなたにぴったりの旅行先を探しています…</p>
      </div>

      <div id="travelResult" class="travel-result hidden">
        <p class="result-small">あなたにおすすめなのは</p>
        <div id="destinationEmoji" class="destination-emoji">🌊</div>
        <h2 id="destinationName">旅行先</h2>
        <p id="destinationDescription"></p>
        <div class="date-badge">2026.09.22 → 09.23</div>
        <button id="restartButton" class="text-button">もう一度診断する</button>
      </div>
    </section>
  </main>

  <script src="js/travel.js"></script>
</body>
</html>
