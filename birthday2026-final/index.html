<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ff8fab">
  <title>Birthday Countdown</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="screen countdown-screen">
    <div class="card">
      <div class="cake">🎂</div>
      <p class="eyebrow">SPECIAL DAY</p>
      <h1>Birthday Countdown</h1>
      <p class="target-date">2026.09.22</p>

      <div id="countdown" class="countdown" aria-live="polite">
        <div><strong id="days">--</strong><span>日</span></div>
        <div><strong id="hours">--</strong><span>時間</span></div>
        <div><strong id="minutes">--</strong><span>分</span></div>
        <div><strong id="seconds">--</strong><span>秒</span></div>
      </div>

      <p class="small-message">もう少しだけ待っていてね。</p>
      <div class="hearts">♡　♡　♡</div>
    </div>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
