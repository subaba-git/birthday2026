<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ff8fab">
  <title>Present Roulette</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="screen">
    <section class="birthday-card roulette-card">
      <p class="eyebrow">PRESENT ROULETTE</p>
      <h1 class="section-title">🎁 プレゼント<br>ルーレット</h1>
      <p class="lead">どれが当たるかな？</p>

      <div class="slot-machine">
        <div class="slot-pointer">▶</div>
        <div class="slot-window">
          <div id="slotItems" class="slot-items">
            <div>ヘアアイロン</div>
            <div>スニーカー</div>
            <div>旅行</div>
            <div>お財布</div>
            <div>ネックレス</div>
            <div>ディズニーチケット</div>
          </div>
        </div>
        <div class="slot-pointer slot-pointer-right">◀</div>
      </div>

      <p class="roulette-hint">6つの候補から運命のプレゼントを決めます</p>

      <button id="spinButton" class="gift-button">🎰 ルーレットを回す</button>

      <div id="rouletteResult" class="result-box hidden">
        <p class="result-small">運命のプレゼントは……</p>
        <div class="winner-emoji">🎁</div>
        <h2>✨ ヘアアイロン ✨</h2>
        <p>おめでとう、なるみ！</p>
        <button id="travelButton" class="gift-button">✈️ 次へ</button>
      </div>
    </section>
  </main>

  <script src="js/roulette.js"></script>
</body>
</html>
